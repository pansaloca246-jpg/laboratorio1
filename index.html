<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tareas</title>
    <link rel="stylesheet" href="styless.css">
</head>
<body>
    <main class="app-container">
        <header class="app-header">
            <h1>Mis Tareas</h1>
        </header>
        
        <form id="todo-form" class="todo-form">
            <input 
                type="text" 
                id="todo-input" 
                class="todo-input" 
                placeholder="¿Qué necesitas hacer?" 
                aria-label="Nueva tarea" 
                required 
                autocomplete="off"
            >
            <select id="todo-priority" class="todo-priority" aria-label="Prioridad de la tarea">
                <option value="baja">Baja</option>
                <option value="media" selected>Media</option>
                <option value="alta">Alta</option>
            </select>
            <button type="submit" class="btn-primary" aria-label="Agregar tarea">Agregar</button>
        </form>

        <div class="filters-container" id="filters-container">
            <button class="filter-btn active" data-filter="todas">Todas</button>
            <button class="filter-btn" data-filter="baja">Baja</button>
            <button class="filter-btn" data-filter="media">Media</button>
            <button class="filter-btn" data-filter="alta">Alta</button>
        </div>

        <ul id="todo-list" class="todo-list" aria-live="polite">
            <!-- Las tareas se renderizan aquí dinámicamente -->
        </ul>
    </main>

    <script src="app.js"></script>
</body>
</html>
